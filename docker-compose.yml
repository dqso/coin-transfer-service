services:
  app:
    build: .
    # No container_name: Compose names the replicas itself (app-1, app-2).
    deploy:
      replicas: 2
    # Each replica takes a free host port from the range: 3000, 3001.
    ports:
      - "3000-3001:3000"
    env_file: .env
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: tern.Dockerfile
    container_name: coin-transfer-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine3.24
    container_name: coin-transfer-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
